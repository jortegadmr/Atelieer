<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Boceto G · Atelier v2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet">
<style>
  :root {
    --fondo: #0f1012; --panel: #16171a; --panel2: #1d1f23; --panel3: #25272c; --borde: #2a2c31;
    --texto: #e9e9eb; --suave: #8b8e95; --tenue: #5d6067; --acento: #d0743c;
    --mas: #d9b25f; --menos: #7f9bb8; --aviso: #e07a5f; --suger: #d9b25f; --bien: #5fb38a;
    --serif: 'Instrument Serif', Georgia, serif; --sans: 'Geist', system-ui, sans-serif; --mono: 'Geist Mono', ui-monospace, monospace;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--fondo); color: var(--texto); font: 13.5px/1.45 var(--sans); height: 100vh; display: grid; grid-template-rows: 46px auto 1fr; overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }

  /* Barra superior */
  .barra { display: flex; align-items: center; gap: 14px; padding: 0 16px; border-bottom: 1px solid var(--borde); background: var(--panel); }
  .marca { font: italic 22px var(--serif); }
  .marca span { color: var(--suave); font: 12px var(--sans); margin-left: 8px; }
  .pasos { display: flex; gap: 2px; margin-left: 10px; }
  .pasos button { background: none; border: 0; padding: 6px 12px; border-radius: 6px; color: var(--suave); display: flex; gap: 6px; align-items: center; }
  .pasos button b { font: 11px var(--mono); color: var(--tenue); }
  .pasos button.on { background: var(--panel3); color: var(--texto); }
  .pasos button.on b { color: var(--acento); }
  .buscar { margin-left: auto; background: var(--panel2); border: 1px solid var(--borde); border-radius: 6px; padding: 5px 10px; color: var(--tenue); min-width: 220px; }
  .ysi { background: var(--panel2); border: 1px solid var(--borde); border-radius: 6px; padding: 5px 10px; }
  .ysi.on { background: #2b1d14; border-color: var(--acento); color: #f3c3a2; }
  .idea { background: var(--acento); border: 0; color: #1c0f06; font-weight: 600; border-radius: 6px; padding: 6px 12px; }

  /* Mapa de la serie, siempre visible */
  .mapa { border-bottom: 1px solid var(--borde); background: var(--panel); padding: 6px 16px 8px; }
  .mapa .cab { display: flex; gap: 12px; align-items: baseline; font-size: 11px; color: var(--suave); margin-bottom: 4px; }
  .mapa .cab b { font-weight: 500; color: var(--texto); }
  .mapa .cab .ley { margin-left: auto; }
  .mapa svg { width: 100%; display: block; }
  .mapa .temp-btn { cursor: pointer; }

  /* Crear en cada nivel */
  .crear { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; margin: 0 0 14px; }
  .crear span { font-size: 11px; color: var(--tenue); text-transform: uppercase; letter-spacing: .8px; margin-right: 4px; }
  .crear button { background: var(--panel2); border: 1px dashed #3d3f45; border-radius: 6px; padding: 4px 10px; font-size: 12.5px; color: var(--texto); }
  .crear button:hover { border-color: var(--acento); color: #f3c3a2; }

  /* La guía junto al campo */
  .pista-guia { display: none; margin-top: 4px; font-size: 11.5px; color: #e9d3a6; background: #241f14; border: 1px solid #4a4020; border-radius: 5px; padding: 5px 8px; }
  .pista-guia b { font-family: var(--mono); font-weight: 500; color: var(--suger); }
  .pista-guia a { color: var(--acento); margin-left: 6px; cursor: pointer; }
  .campo:focus-within .pista-guia { display: block; }

  /* Ventana «Nueva pieza» */
  .velo { position: fixed; inset: 0; background: #000a; display: none; align-items: center; justify-content: center; z-index: 20; }
  .velo.on { display: flex; }
  .ventana { width: min(860px, 94vw); background: var(--panel); border: 1px solid #3a3c42; border-radius: 12px; box-shadow: 0 20px 60px #000c; display: grid; grid-template-columns: 1fr 340px; overflow: hidden; }
  .ventana .izq { padding: 18px; }
  .ventana .der { background: var(--panel2); border-left: 1px solid var(--borde); padding: 16px; max-height: 70vh; overflow: auto; }
  .ventana h2 { margin: 0 0 12px; font: 26px var(--serif); font-weight: 400; }
  .tipos { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 12px; }
  .tipos button { background: var(--panel2); border: 1px solid var(--borde); border-radius: 99px; padding: 3px 10px; font-size: 12px; color: var(--suave); }
  .tipos button.on { background: #2b1d14; border-color: var(--acento); color: #f3c3a2; }
  .ventana .campo { margin-bottom: 10px; }
  .radio { display: flex; gap: 8px; }
  .radio label { flex: 1; border: 1px solid var(--borde); border-radius: 8px; padding: 8px; font-size: 12.5px; cursor: pointer; }
  .radio label.on { border-color: var(--acento); background: #2b1d14; }
  .radio small { display: block; color: var(--suave); }
  .ruta { font: 11.5px var(--mono); color: var(--suave); background: var(--panel2); border-radius: 5px; padding: 6px 8px; margin: 8px 0 14px; }
  .botones { display: flex; justify-content: flex-end; gap: 8px; }
  .botones button { background: var(--panel3); border: 1px solid var(--borde); border-radius: 6px; padding: 7px 14px; }
  .botones button.prim { background: var(--acento); border-color: var(--acento); color: #1c0f06; font-weight: 600; }
  .regla-n { font-size: 12.5px; padding: 6px 0; border-bottom: 1px solid var(--borde); }
  .regla-n b { font: 11px var(--mono); color: var(--suger); margin-right: 4px; }
  .regla-n small { display: block; color: var(--tenue); font-size: 11px; }
  .aviso-crear { font-size: 12px; color: #f3a58f; margin-top: 4px; }
  .toast { position: fixed; top: 60px; left: 50%; transform: translateX(-50%); background: #1f3a2c; border: 1px solid #2f5d45; color: #cdeedd; padding: 8px 14px; border-radius: 8px; font-size: 13px; display: none; z-index: 30; }
  .toast.on { display: block; }
  .guias-activas { font-size: 12px; color: var(--suave); background: var(--panel2); border-radius: 6px; padding: 8px 10px; margin-bottom: 10px; }
  .guias-activas a { color: var(--acento); cursor: pointer; }
  .grupo-reglas { font-size: 11px; color: var(--suave); text-transform: uppercase; letter-spacing: .8px; margin: 12px 0 2px; }
  .ysi-barra { display: none; align-items: center; gap: 10px; padding: 6px 16px; background: #22170f; border-bottom: 1px solid #5a3218; font-size: 12.5px; color: #f3c3a2; }
  body.ysi-on .ysi-barra { display: flex; }
  .ysi-barra .chip { background: #3a2414; border: 1px solid #6b3a1c; border-radius: 99px; padding: 2px 10px; }
  .ysi-barra .der { margin-left: auto; display: flex; gap: 6px; }
  .ysi-barra .der button { background: var(--panel2); border: 1px solid var(--borde); border-radius: 5px; padding: 3px 9px; font-size: 12px; }
  .ysi-barra .der button.prim { background: var(--acento); border-color: var(--acento); color: #1c0f06; font-weight: 600; }

  /* Zona de trabajo */
  .trabajo { display: grid; grid-template-columns: 1fr 360px; min-height: 0; }
  .centro { overflow: auto; padding: 18px 22px 60px; }
  .eti { font-size: 11px; letter-spacing: .8px; text-transform: uppercase; color: var(--suave); }
  h1.tit { font: 34px/1.1 var(--serif); margin: 2px 0 4px; font-weight: 400; }
  .lema { font: italic 17px var(--serif); color: var(--suave); margin: 0 0 16px; max-width: 70ch; }
  .tarjetas { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-bottom: 18px; }
  .tarj { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 12px; cursor: pointer; }
  .tarj:hover { border-color: #3a3c42; }
  .tarj.sel { border-color: var(--acento); }
  .tarj .ref { float: right; font: 11px var(--mono); color: var(--tenue); }
  .tarj p { margin: 6px 0 0; font: 17px/1.35 var(--serif); }
  .tarj.vacia { border-style: dashed; }
  .tarj.vacia p { color: var(--tenue); font-style: italic; }
  .pill { display: inline-flex; gap: 6px; align-items: center; background: var(--panel2); border: 1px solid var(--borde); border-radius: 99px; padding: 3px 10px; font-size: 12px; margin-right: 6px; }
  .bloque { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 12px 14px; margin-bottom: 14px; }
  .bloque > .eti { margin-bottom: 8px; display: flex; justify-content: space-between; }
  svg text { font-family: var(--sans); }

  /* Lista + detalle (Tramas) */
  .taller { display: grid; grid-template-columns: 260px 1fr; gap: 14px; }
  .lista { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 8px; align-self: start; }
  .lista .grupo { font-size: 11px; color: var(--suave); text-transform: uppercase; letter-spacing: .8px; padding: 8px 8px 4px; display: flex; justify-content: space-between; }
  .fila { display: flex; gap: 8px; align-items: center; padding: 7px 8px; border-radius: 6px; cursor: pointer; }
  .fila:hover { background: var(--panel2); }
  .fila.sel { background: var(--panel3); }
  .fila .barra-c { width: 3px; align-self: stretch; border-radius: 2px; }
  .fila .t { flex: 1; } .fila .t small { display: block; color: var(--suave); font-size: 11.5px; }
  .fila.sang { padding-left: 22px; }
  .fila.desc .t { text-decoration: line-through; color: var(--tenue); }
  .abc { font: 11px var(--mono); border: 1px solid var(--borde); border-radius: 4px; padding: 0 5px; color: var(--suave); }
  .madurez { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .m-canon { background: var(--bien); } .m-borrador { border: 1.5px dashed var(--suave); } .m-idea { border: 1.5px dotted var(--tenue); } .m-propuesta { background: #a07ad6; }
  .tri { color: var(--aviso); font-size: 11px; }
  .beats { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .beat { background: var(--panel2); border: 1px solid var(--borde); border-radius: 8px; padding: 8px; min-height: 92px; }
  .beat .eti { font-size: 10px; } .beat .donde { font: 11px var(--mono); color: var(--acento); } .beat p { margin: 4px 0 0; font-size: 12.5px; }
  .beat.vacia { border-style: dashed; } .beat.vacia p { color: var(--tenue); font-style: italic; }
  .campos { display: grid; grid-template-columns: 1fr 1fr; gap: 10px 14px; }
  .campo label { display: block; font-size: 11.5px; color: var(--suave); margin-bottom: 3px; }
  .campo label i { color: var(--tenue); font-style: normal; font-family: var(--mono); font-size: 10.5px; margin-left: 4px; }
  .campo input, .campo select, .campo textarea { width: 100%; background: var(--panel2); color: var(--texto); border: 1px solid var(--borde); border-radius: 6px; padding: 7px 9px; font: inherit; }
  .campo textarea { min-height: 54px; resize: vertical; }
  .campo.cambiado select, .campo.cambiado input { border-color: var(--acento); box-shadow: 0 0 0 1px var(--acento); }
  .campo.vacio input { border-style: dashed; }

  /* Temporada */
  .cajas { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 14px; }
  .caja { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 10px; }
  .caja p { margin: 6px 0 0; font: 16px/1.35 var(--serif); }
  .cargas { display: grid; grid-template-columns: 120px repeat(8, 1fr); gap: 4px; align-items: center; }
  .cargas .ep { text-align: center; font: 11px var(--mono); color: var(--suave); }
  .cargas button { background: var(--panel2); border: 1px solid var(--borde); border-radius: 6px; padding: 4px 0; font: 600 13px var(--mono); }
  .cargas button.mal { border-color: var(--aviso); background: #2b1b17; }
  .mas { color: var(--mas); } .menos { color: var(--menos); }
  .bandeja { display: flex; gap: 8px; flex-wrap: wrap; }
  .evento { background: var(--panel2); border: 1px solid var(--borde); border-left: 3px solid var(--c, #555); border-radius: 6px; padding: 6px 9px; font-size: 12.5px; cursor: grab; }

  /* Rejilla */
  .rejilla { display: grid; grid-template-columns: 170px repeat(8, 1fr); border: 1px solid var(--borde); border-radius: 10px; overflow: hidden; }
  .rejilla > div { border-right: 1px solid var(--borde); border-bottom: 1px solid var(--borde); padding: 6px; min-height: 44px; }
  .rejilla .cab { background: var(--panel2); font: 11px var(--mono); color: var(--suave); text-align: center; min-height: 0; }
  .rejilla .cab b { display: block; font: 12px var(--sans); color: var(--texto); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .rejilla .arco { background: var(--panel); font-size: 12.5px; display: flex; gap: 6px; align-items: center; }
  .rejilla .celda { position: relative; cursor: pointer; }
  .rejilla .celda:hover { background: #1b1c20; }
  .rejilla .celda .linea { position: absolute; left: 0; right: 0; top: 50%; height: 3px; background: var(--c); opacity: .5; }
  .rejilla .celda .linea.borr { background: repeating-linear-gradient(90deg, var(--c) 0 6px, transparent 6px 10px); }
  .rejilla .celda .parada { position: relative; z-index: 1; display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 11px; text-align: center; }
  .parada i { width: 14px; height: 14px; border-radius: 50%; background: var(--fondo); border: 3px solid var(--c); display: block; }
  .parada i.avanza { background: var(--c); border-width: 0; width: 10px; height: 10px; }
  .parada i.gira { background: linear-gradient(90deg, var(--c) 50%, var(--fondo) 50%); }
  .parada i.cierra { border-radius: 2px; width: 6px; height: 16px; background: var(--c); border: 0; }
  .rejilla .celda.olvido { background: repeating-linear-gradient(45deg, transparent 0 6px, #e07a5f14 6px 12px); }

  /* Escenas */
  .actos { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .acto { background: var(--panel); border: 1px solid var(--borde); border-radius: 10px; padding: 8px; min-height: 300px; }
  .acto h4 { margin: 0 0 8px; font: italic 17px var(--serif); font-weight: 400; display: flex; justify-content: space-between; }
  .acto h4 small { font: 11px var(--sans); color: var(--suave); font-style: normal; }
  .escena { background: var(--panel2); border: 1px solid var(--borde); border-radius: 8px; padding: 8px; margin-bottom: 8px; cursor: pointer; }
  .escena.sel { border-color: var(--acento); }
  .escena .cab2 { display: flex; justify-content: space-between; font: 11px var(--mono); color: var(--suave); }
  .escena p { margin: 4px 0 6px; font-size: 12.5px; }
  .escena .hilos { display: flex; gap: 4px; flex-wrap: wrap; }
  .escena .hilo { font-size: 10.5px; padding: 1px 6px; border-radius: 99px; background: color-mix(in srgb, var(--c) 22%, transparent); color: var(--c); }
  .escena.mal { border-color: var(--aviso); }
  .nueva { border: 1px dashed var(--borde); border-radius: 8px; padding: 8px; text-align: center; color: var(--tenue); }

  /* Panel derecho */
  .lado { border-left: 1px solid var(--borde); background: var(--panel); display: flex; flex-direction: column; min-height: 0; }
  .pestanas { display: flex; border-bottom: 1px solid var(--borde); }
  .pestanas button { flex: 1; background: none; border: 0; padding: 10px 6px; color: var(--suave); border-bottom: 2px solid transparent; font-size: 12.5px; }
  .pestanas button.on { color: var(--texto); border-bottom-color: var(--acento); }
  .pestanas .n { font: 10px var(--mono); background: var(--panel3); border-radius: 99px; padding: 1px 6px; margin-left: 4px; }
  .pestanas .n.mal { background: #4a2219; color: #f3a58f; }
  .contenido { overflow: auto; padding: 14px; flex: 1; }
  .pieza-tit { font: 24px/1.15 var(--serif); margin: 2px 0 8px; }
  .estados { display: flex; flex-wrap: wrap; gap: 4px; margin: 6px 0 12px; }
  .estados span { font-size: 11.5px; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--borde); color: var(--suave); }
  .estados span.on { background: var(--panel3); color: var(--texto); border-color: #444; }
  .donde { font-size: 11.5px; color: var(--tenue); margin-bottom: 10px; }
  .efecto { padding: 8px 10px; border-radius: 6px; background: var(--panel2); margin-bottom: 6px; font-size: 12.5px; display: flex; gap: 8px; }
  .efecto .ico { flex: none; width: 16px; text-align: center; color: var(--suave); }
  .efecto small { display: block; color: var(--suave); margin-top: 2px; }
  .efecto.mal { background: #26181499; border-left: 3px solid var(--aviso); }
  .efecto.mal .ico { color: var(--aviso); }
  .efecto.sug { border-left: 3px solid var(--suger); }
  .efecto.sug .ico { color: var(--suger); }
  .efecto.bien { border-left: 3px solid var(--bien); }
  .efecto .acc { display: flex; gap: 6px; margin-top: 6px; }
  .efecto .acc button { background: var(--panel3); border: 1px solid var(--borde); border-radius: 4px; padding: 2px 8px; font-size: 11.5px; }
  .vacio { color: var(--tenue); font-size: 12.5px; }
  .regla { padding: 8px 0; border-bottom: 1px solid var(--borde); font-size: 12.5px; display: flex; gap: 8px; }
  .regla .m { flex: none; width: 16px; text-align: center; }
  .regla small { display: block; color: var(--tenue); font-family: var(--mono); font-size: 10.5px; }
  .pie-lado { border-top: 1px solid var(--borde); padding: 8px 14px; font-size: 11.5px; color: var(--tenue); display: flex; justify-content: space-between; }
  .nota { position: fixed; bottom: 10px; left: 16px; font-size: 12px; color: var(--suave); background: var(--panel3); padding: 6px 10px; border-radius: 6px; border: 1px dashed #444; max-width: 640px; z-index: 5; }
</style>
</head>
<body>
<header class="barra">
  <div class="marca">Atelier<span>Primera · prueba</span></div>
  <nav class="pasos" id="pasos"></nav>
  <div class="buscar">Buscar o crear…  Ctrl K</div>
  <button class="ysi" id="ysi">¿Y si…?</button>
  <button class="idea">+ Idea</button>
</header>

<div>
  <section class="mapa">
    <div class="cab"><b>La serie entera</b><span id="ubicacion"></span><span class="ley">— canon · - - borrador · ··· idea · naranja: cómo quedaría</span></div>
    <svg id="mapa"></svg>
  </section>
  <div class="ysi-barra"><b>¿Y si…?</b><span class="chip">Nando se va en E05</span><span>Estás viendo cómo quedaría. Nada toca la serie hasta que pulses «Aplicar».</span>
    <div class="der"><button id="ysi-ahora">Ver ahora</button><button>Aparcar</button><button>Descartar</button><button class="prim">Aplicar</button></div></div>
</div>

<div class="trabajo">
  <main class="centro" id="centro"></main>
  <aside class="lado">
    <div class="pestanas" id="pestanas"></div>
    <div class="contenido" id="lado"></div>
    <div class="pie-lado"><span>● Guardado hace 2 s</span><span>Solo abierta en PC-ESTUDIO</span></div>
  </aside>
</div>

<div class="nota" id="nota"></div>
<div class="velo" id="velo"><div class="ventana" id="ventana"></div></div>
<div class="toast" id="toast"></div>

<script>
/* ---------- Reglas reales de appDatos/guia.md (id, pieza, texto, fuente, comprobación) ---------- */
const REGLAS = [["G01", "serie", "Las 10-11 preguntas, como lista antes de dar la historia por planeada.", "§29", ""], ["G02", "serie", "Decide el final antes de escribir, aunque sea en una línea.", "§18 · F1.6", "C18"], ["G03", "serie", "La pregunta de oro nace al inicio; el final la responde.", "§18", ""], ["G04", "serie", "Todo nace de los personajes enfrentándose a sus creencias: conflicto externo, interno y filosófico.", "§3", ""], ["G05", "serie", "Logline: protagonista, objetivo, problema, acción y catalizador. Si no cabe en un párrafo, es pronto.", "§4", ""], ["G06", "serie", "Define la dinámica de la historia y repítela: siempre conflicto, cada vez más difícil, y cada capítulo acerca a la meta.", "§25", ""], ["G07", "arco de trama", "Deja muy claro qué quiere y por qué lo quiere.", "§10", "C03"], ["G08", "arco de trama", "Todo conflicto trae algo que ganar y algo que perder.", "§10", "C03"], ["G09", "arco de trama", "El riesgo es relativo a la situación del personaje, no absoluto.", "§10", ""], ["G10", "arco de trama", "Bomba de tiempo: una cuenta atrás que, al llegar a cero, hace estallar la consecuencia.", "§10", "C03"], ["G11", "arco de trama", "Usa las consecuencias como motor: dos pasos adelante, uno atrás.", "§3", ""], ["G12", "arco de trama", "La trama principal llega hasta el final de la serie: no la cierres antes del último episodio.", "§12", "C12"], ["G13", "arco de trama", "Un arco de temporada se cierra dentro de su temporada.", "§12", "C10"], ["G14", "arco de trama", "Que ningún arco desaparezca demasiados episodios seguidos: el público lo olvida.", "§25", "C11"], ["G15", "arco de trama", "Si fijas a mano dónde empieza o acaba, que coincida con los eventos que lo abren y lo cierran.", "Diseño 4.4", "C13"], ["G16", "subtrama", "Dale su propio protagonista y su propio conflicto.", "§13", "C05"], ["G17", "subtrama", "Arranca después de presentar la principal y se resuelve antes.", "§13", "C06"], ["G18", "subtrama", "Proporción 70/30 entre la princ // Campo con su regla de la guía: la pista sale al escribir en él.
function campo({ label, valor = '', vacio = '', reglas = [], ancho = false, attrs = '', select = null, cambiado = false }) {
  const pista = reglas.map(id => { const r = regla(id); return r ? `<div><b>${id}</b>${r[2]} <span style="color:var(--tenue)">· ${fuente(r[3])}</span></div>` : ''; }).join('');
  const ctl = select ? `<select ${attrs}>${select}</select>` : `<input ${attrs} value="${valor}" placeholder="${vacio}">`;
  return `<div class="campo ${!valor && !select ? 'vacio' : ''} ${cambiado ? 'cambiado' : ''}" ${ancho ? 'style="grid-column:1/-1"' : ''}><label>${label}${reglas.length ? ` <i>${reglas.join(' · ')}</i>` : ''}</label>${ctl}${pista ? `<div class="pista-guia">${pista}<a data-ver-guia="1">Ver en la guía</a></div>` : ''}</div>`;
}

/* ---------- Mapa de la serie: se dibuja al ancho real, sin deformar ---------- */
function mapa() {
  const svg = $('mapa'), W = svg.clientWidth || 1200, ks = Object.keys(ARCOS), FILA = 13;
  const H = 24 + ks.length * FILA + 16, X0 = 170, P = (W - X0 - 8) / 18, x = i => X0 + i * P + P / 2;
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`); svg.style.height = H + 'px';
  let h = '';
  const temp = (i0, n, t, prev) => `<g class="temp-btn" data-p="temporada"><rect x="${X0 + i0 * P}" y="2" width="${P * n - 4}" height="${H - 4}" rx="5" ${prev ? 'fill="none" stroke="#33353b" stroke-dasharray="4 4"' : 'fill="#1b1c20"'}/><text x="${X0 + i0 * P + 8}" y="15" fill="${prev ? '#5d6067' : '#a4a7ad'}" font-size="11">${t}</text></g>`;
  h += temp(0, 8, 'T1 · Cerrar la emisora') + temp(8, 8, 'T2 · La réplica') + temp(16, 2, 'T3 prevista', true);
  state.carga.forEach((c, i) => h += `<text x="${x(i)}" y="${H - 5}" text-anchor="middle" font-size="10" font-family="Geist Mono, monospace"><tspan fill="${c[0] === '+' ? '#d9b25f' : '#7f9bb8'}">${c[0]}</tspan><tspan fill="${c[1] === '+' ? '#d9b25f' : '#7f9bb8'}">${c[1]}</tspan></text>`);
  let y = 28;
  for (const k of ks) {
    const a = ARCOS[k], fin = Math.min(rangoYsi(k, arcoFin(k)), 17), resalta = state.paso === 'tramas' && k === state.arco;
    const dash = a.m === 'borrador' ? '7 4' : a.m === 'idea' ? '1.5 4' : '';
    h += `<text x="6" y="${y + 4}" font-size="11" fill="${resalta ? '#e9e9eb' : '#80838a'}" data-arco="${k}" style="cursor:pointer">${a.t}</text>`;
    const seg = (i0, i1) => i1 < i0 ? '' : `<path d="M${x(i0)} ${y} L${x(i1)} ${y}" stroke="${a.c}" stroke-width="${resalta ? 4 : 2.5}" stroke-dasharray="${dash}" stroke-linecap="round" opacity="${resalta ? 1 : .75}"/>`;
    if (a.hueco) { h += seg(a.ini, a.hueco[0] - 1) + seg(a.hueco[1] + 1, fin) + `<rect x="${x(a.hueco[0]) - P / 2}" y="${y - 5}" width="${P * (a.hueco[1] - a.hueco[0] + 1)}" height="10" rx="2" fill="#e07a5f26"/>`; }
    else h += seg(a.ini, fin);
    if (a.nuevo) h += `<circle cx="${x(a.ini)}" cy="${y}" r="4" fill="${a.c}"/>`;
    if (k === 'her' && state.fin !== base.fin) h += `<path d="M${x(Math.min(base.fin, state.fin))} ${y + 4} L${x(state.fin)} ${y + 4}" stroke="#d0743c" stroke-width="2.5" stroke-dasharray="2 4" stroke-linecap="round"/>`;
    if (ysiActivo() && (k === 'her' || k === 'amo')) h += `<path d="M${x(4)} ${y + 4} L${x(a.fin)} ${y + 4}" stroke="#d0743c" stroke-width="2" stroke-dasharray="2 4"/><text x="${x(4) + 8}" y="${y - 3}" fill="#d0743c" font-size="10">se corta en E05</text>`;
    y += FILA;
  }
  const marca = { serie: [0, 17], tramas: [ARCOS[state.arco].ini, Math.min(arcoFin(state.arco), 17)], temporada: [0, 7], episodios: [0, 7], escenas: [4, 4] }[state.paso];
  h += `<rect x="${x(marca[0]) - P / 2 + 1}" y="1" width="${P * (marca[1] - marca[0] + 1) - 2}" height="${H - 2}" rx="5" fill="none" stroke="#d0743c" stroke-width="1.3" opacity=".75"/>`;
  svg.innerHTML = h;
  $('ubicacion').textContent = { serie: 'Estás en: la serie', tramas: 'Estás en: ' + ARCOS[state.arco].t, temporada: 'Estás en: T1', episodios: 'Estás en: T1 · rejilla', escenas: 'Estás en: T1 · E05 El apagón' }[state.paso] + ' · clic en una temporada o un arco para ir';
}

  const a = ARCOS[state.arco];
  const titulo = { serie: ['Serie', 'Primera · prueba', 'appDatos/prueba/serie.md · mesa'], tramas: [(a.tipo === 'trama' ? 'Trama' : 'Arco de ' + a.tipo) + ' · ' + a.abc, a.t, a.m === 'idea' ? 'appDatos/prueba/arcos/' + a.t + '.md · mesa' : 'MiSerie/01_Wiki/01_Narrativa/Arcos/' + a.t + '.md · wiki'], temporada: ['Temporada', 'T1 · Cerrar la emisora', 'MiSerie/01_Wiki/01_Narrativa/Temporadas/T01.md · wiki'], episodios: ['Temporada', 'T1 · rejilla', 'wiki · Episodios/'], escenas: ['Episodio · propuesta', 'T1·E05 El apagón', 'appDatos/prueba/episodios/ep-a105.md · mesa'] }[state.paso];
  const est = ['idea', 'propuesta', 'aparcado', 'borrador', 'canon', 'descartado'], on = state.paso === 'escenas' ? 'propuesta' : state.paso === 'tramas' ? a.m : 'canon';
  let h = `<div class="eti">${titulo[0]}</div><div class="pieza-tit">${titulo[1]}</div><div class="estados">${est.map(e => `<span class="${e === on ? 'on' : ''}">${e}${e === 'canon' && on === 'canon' ? ' 🔒' : ''}</span>`).join('')}</div><div class="donde">${titulo[2]}</div>`;
  if (state.pest === 'efectos') h += ef.map(([c, ico, t, s, acc]) => c === 'vacio' ? `<p class="vacio">${t}</p>` : `<div class="efecto ${c}"><span class="ico">${ico}</span><div>${t}${s ? `<small>${s}</small>` : ''}${acc ? '<div class="acc"><button>Ir al campo</button><button data-pest="guia">Ver regla</button><button>Seguir así (a propósito)</button></div>' : ''}</div></div>`).join('');
  if (state.pest === 'guia') {
    h += `<div class="guias-activas">Guías activas: <a>Guía de Atelier</a> (appDatos/guia.md) · <a>Chuleta de escritura de series</a> · <a>Plantillas</a> · Chuleta de magia: <i>desactivada</i></div>`;
    h += `<div class="grupo-reglas">Para ${piezas.join(' y ')} · ${reglas.length} reglas · ${nMal} sin cumplir</div>`;
    h += reglas.map(r => { const mal = falla(r[0]), comp = !!r[4]; const st = mal ? '✗' : comp ? '✓' : '·'; const col = mal ? 'var(--aviso)' : comp ? 'var(--bien)' : 'var(--tenue)';
      return `<div class="regla"><span class="m" style="color:${col}">${st}</span><div>${r[2]}<small>${r[0]} · ${fuente(r[3])} · ${mal ? 'no se cumple' : comp ? 'se cumple' : 'solo de lectura: lo juzgas tú'}</small></div></div>`; }).join('');
    h += `<p class="vacio" style="margin-top:10px">Editas las reglas en appDatos/guia.md (o desde aquí): una fila por regla.</p>`;
  }
  if (state.pest === 'editar') h += `<div class="campo"><label>Notas libres</label><textarea style="min-height:180px">Escribe lo que quieras: no hay campos obligatorios. Se guarda solo en la mesa o en la wiki según su estado.</textarea></div><div style="margin-top:10px" class="vacio">Pasar a borrador crea la ficha en la wiki con su plantilla y una entrada en Log.md.</div>`;
  $('lado').innerHTML = h;
}

/* ---------- Pintar ---------- */
const NOTAS = {
  serie: 'Paso 1: la serie entera. Arriba, «Crear» en cada nivel; clic en un campo de la logline y debajo sale su regla de la guía. Prueba «+ Idea» o «+ Trama de serie».',
  tramas: 'Paso 2: crea una trama con «+ Trama de serie» y mira «Si lo dejas así». O elige «Amistad rota» y cambia «Termina en» a T2·E04.',
  temporada: 'Paso 3: pulsa un + o − de la curva de carga. Se marcan en rojo los episodios que dejan de encajar y la regla.',
  episodios: 'Paso 4: la rejilla. Clic en una celda vacía crea un evento ahí. Las rayas rojizas marcan dónde un arco desaparece.',
  escenas: 'Paso 5: «+ Escena» en cada acto. Activa «¿Y si…?» arriba para ver la prueba «Nando se va en E05».',
};
function pintar() {
  document.body.classList.toggle('ysi-on', state.ysi);
  $('ysi').classList.toggle('on', state.ysi);
  $('ysi-ahora').textContent = state.ysiVer ? 'Ver ahora' : 'Ver cómo quedaría';
  pasos(); $('centro').innerHTML = V[state.paso](); mapa(); lado(); $('nota').textContent = 'Boceto G — ' + NOTAS[state.paso];
}
document.addEventListener('click', e => {
  const t = e.target.closest('[data-p],[data-pest],[data-arco],[data-carga],[data-esc],[data-nuevo],[data-tipo],[data-est],[data-crear],[data-cerrar],[data-ver-guia],#ysi,#ysi-ahora,.idea');
  if (!t) { if (e.target.id === 'velo') $('velo').classList.remove('on'); return; }
  if (t.classList.contains('idea')) return abrirNuevo('idea');
  if (t.dataset.nuevo) return abrirNuevo(t.dataset.nuevo, t.dataset.en);
  if (t.dataset.tipo) { state.nuevo.titulo = $('nuevo-tit').value; state.nuevo.tipo = t.dataset.tipo; state.nuevo.en = null; return ventana(); }
  if (t.dataset.est) { state.nuevo.titulo = $('nuevo-tit').value; state.nuevo.estado = t.dataset.est; return ventana(); }
  if (t.dataset.crear) return crearPieza();
  if (t.dataset.cerrar) return $('velo').classList.remove('on');
  if (t.dataset.verGuia) state.pest = 'guia';
  else if (t.dataset.p) { state.paso = t.dataset.p; state.pest = 'efectos'; }
  else if (t.dataset.pest) state.pest = t.dataset.pest;
  else if (t.dataset.arco) { state.arco = t.dataset.arco; state.paso = 'tramas'; }
  else if (t.dataset.carga) { const [i, l] = t.dataset.carga.split('-').map(Number); state.carga[i][l] = state.carga[i][l] === '+' ? '−' : '+'; }
  else if (t.dataset.esc) state.escena = t.dataset.esc;
  else if (t.id === 'ysi') { state.ysi = !state.ysi; state.ysiVer = true; }
  else if (t.id === 'ysi-ahora') state.ysiVer = !state.ysiVer;
  pintar();
});
document.addEventListener('input', e => { if (e.target.id === 'nuevo-tit') { const r = document.querySelector('.ruta'); state.nuevo.titulo = e.target.value; if (r) { ventana(); const i = $('nuevo-tit'); i.focus(); i.setSelectionRange(i.value.length, i.value.length); } } });
document.addEventListener('keydown', e => { if (e.key === 'Escape') $('velo').classList.remove('on'); if (e.key === 'Enter' && $('velo').classList.contains('on')) crearPieza(); if (e.ctrlKey && e.code === 'Space') { e.preventDefault(); abrirNuevo('idea'); } });
document.addEventListener('change', e => {
  const c = e.target.dataset.c; if (!c) return;
  if (c === 'fin') state.fin = +e.target.value; if (c === 'nivel') state.nivel = e.target.value;
  state.pest = 'efectos'; pintar();
});
window.addEventListener('resize', mapa);
pintar();

</script>
</body>
</html>
